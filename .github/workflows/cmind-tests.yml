name: CoderMind Tests

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "CoderMind/**"
      - ".github/workflows/cmind-*.yml"
  pull_request:
    paths:
      - "CoderMind/**"
      - ".github/workflows/cmind-*.yml"
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: CoderMind
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: CoderMind/pyproject.toml

      - name: Install CoderMind
        run: python -m pip install -e .

      - name: Run multi-agent adapter tests
        run: python -m pytest -q tests/test_multi_agent_adapters.py
