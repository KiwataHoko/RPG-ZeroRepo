name: Domain Graph

on:
  push:
    paths:
      - "domain_graph/**"
      - ".github/workflows/domain-graph.yml"
  pull_request:
    paths:
      - "domain_graph/**"
      - ".github/workflows/domain-graph.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./domain_graph pytest
      - run: python -m pytest domain_graph/tests
