name: Domain Graph

on:
  push:
    paths:
      - "domain_graph/**"
      - ".github/workflows/domain-graph.yml"
  pull_request:
    paths:
      - "domain_graph/**"
      - ".github/workflows/domain-graph.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ./domain_graph pytest
      - run: python -m pytest domain_graph/tests

  compatibility:
    name: v1 compatibility (Python 3.12)
    runs-on: ubuntu-latest
    env:
      CURRENT_PAYLOAD: ${{ runner.temp }}/domain-graph-current-v1.json
      FIXTURE_DIR: ${{ github.workspace }}/domain_graph/tests/fixtures/v1
      RELEASE_VENV: ${{ runner.temp }}/domain-graph-release-venv
      RELEASE_WHEEL_URL: https://github.com/${{ github.repository }}/releases/download/domain-graph-v0.1.0/domain_graph-0.1.0-py3-none-any.whl
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install current checkout
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "${GITHUB_WORKSPACE}/domain_graph" pytest
      - name: Run current v1 compatibility tests
        run: |
          python -m pytest \
            "${GITHUB_WORKSPACE}/domain_graph/tests/test_v1_compatibility.py" \
            "${GITHUB_WORKSPACE}/domain_graph/tests/test_serialization_edge_cases.py"
      - name: Generate representative v1 payload from current checkout
        run: |
          cd "${GITHUB_WORKSPACE}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from domain_graph import DomainGraph, DomainSchema, RelationSpec

          output = Path(os.environ["CURRENT_PAYLOAD"])
          schema = DomainSchema(
              "compatibility-sample",
              entity_types=("topic", "claim", "evidence"),
              relations=(
                  RelationSpec("contains", hierarchy=True),
                  RelationSpec("supports"),
              ),
          )
          graph = DomainGraph("current-checkout", schema, strict_schema=True)
          graph.add_node(
              "topic-1",
              "topic",
              name="Compatibility topic",
              data={"labels": ["v1", "current"], "metadata": {"ordinal": 1}},
          )
          graph.add_node("claim-1", "claim", name="A representative claim")
          graph.add_node(
              "evidence-1",
              "evidence",
              data={"source": "current checkout", "pages": [1, 2]},
          )
          graph.add_edge("topic-1", "claim-1", "contains")
          graph.add_edge("claim-1", "evidence-1", "supports")
          if graph.validate() != ():
              raise AssertionError("generated representative graph is invalid")
          output.write_text(
              json.dumps(graph.to_dict(), ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY
      - name: Install published 0.1.0 wheel in isolated environment
        run: |
          python -m venv "${RELEASE_VENV}"
          "${RELEASE_VENV}/bin/python" -m pip install \
            --disable-pip-version-check \
            --no-deps \
            "${RELEASE_WHEEL_URL}"
      - name: Validate published 0.1.0 against v1 fixtures and current payload
        run: |
          cd "${RUNNER_TEMP}"
          env -u PYTHONPATH "${RELEASE_VENV}/bin/python" - <<'PY'
          import json
          import os
          from pathlib import Path

          import domain_graph
          from domain_graph import DomainGraph

          fixture_dir = Path(os.environ["FIXTURE_DIR"])
          current_payload_path = Path(os.environ["CURRENT_PAYLOAD"])
          fixture_paths = sorted(fixture_dir.glob("*.json"))
          if not fixture_paths:
              raise AssertionError(f"no v1 fixtures found in {fixture_dir}")
          if domain_graph.__version__ != "0.1.0":
              raise AssertionError(
                  f"expected released domain_graph 0.1.0, got {domain_graph.__version__}"
              )

          def assert_semantic_round_trip(path: Path) -> None:
              payload = json.loads(path.read_text(encoding="utf-8"))
              graph = DomainGraph.from_dict(payload)
              if graph.to_dict() != payload:
                  raise AssertionError(f"dict round-trip changed {path}")
              restored = DomainGraph.from_json(graph.to_json())
              if restored.to_dict() != payload:
                  raise AssertionError(f"JSON round-trip changed {path}")

          for fixture_path in fixture_paths:
              assert_semantic_round_trip(fixture_path)
          assert_semantic_round_trip(current_payload_path)

          representative = DomainGraph.from_json(
              current_payload_path.read_text(encoding="utf-8")
          )
          if [node.id for node in representative.children("topic-1")] != ["claim-1"]:
              raise AssertionError("released reader changed hierarchy semantics")
          if [node.id for node in representative.neighbors(
              "evidence-1", relation="supports", direction="in"
          )] != ["claim-1"]:
              raise AssertionError("released reader changed relation semantics")
          print(
              f"validated {len(fixture_paths)} committed v1 fixtures and "
              "one current-checkout payload with domain_graph 0.1.0"
          )
          PY
