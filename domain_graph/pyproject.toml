[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "domain-graph"
version = "0.1.0"
description = "Domain-neutral graph core with schema-defined hierarchy semantics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
packages = ["domain_graph", "domain_graph.adapters"]

[tool.setuptools.package-dir]
domain_graph = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
